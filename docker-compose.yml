services:
  mysql:
    image: mysql:8.0
    container_name: devnet2-mysql
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: devnet2
      MYSQL_USER: devnet
      MYSQL_PASSWORD: devnetpassword
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - devnet-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  devnet-api:
    build: .
    container_name: devnet2-api
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: mysql+pymysql://devnet:devnetpassword@mysql:3306/devnet2
      GNS3_HOST: gns3
      GNS3_PORT: 3080
      GNS3_USERNAME: admin
      GNS3_PASSWORD: admin
      LOG_LEVEL: INFO
    depends_on:
      mysql:
        condition: service_healthy
    volumes:
      - ./topology.yml:/app/topology.yml:ro
      - ./reports:/app/reports
    networks:
      - devnet-network
    restart: unless-stopped

networks:
  devnet-network:
    driver: bridge

volumes:
  mysql_data: